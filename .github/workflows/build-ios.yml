name: build-ios

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-26
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native iOS project (prebuild + pods)
        run: bunx expo prebuild --platform ios --clean

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/GlassChat.xcworkspace \
            -scheme GlassChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/GlassChat.app" Payload/
          zip -qr GlassChat.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GlassChat-ipa
          path: GlassChat.ipa
          retention-days: 30
